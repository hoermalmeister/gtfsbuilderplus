<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTFS Editor</title>
    <!-- Modern Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --bg-nav: #1e293b;
            --text-main: #334155;
            --border: #e2e8f0;
            --bg-light: #f8fafc;
        }

        body { 
            margin: 0; padding: 0; 
            display: flex; height: 100vh; 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 260px;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            flex-direction: column;
        }

        .brand { padding: 24px; font-size: 1.25rem; font-weight: 600; letter-spacing: 0.5px; border-bottom: 1px solid #334155; }
        .nav-items { flex-grow: 1; padding: 16px 12px; }
        
        .nav-btn {
            width: 100%; text-align: left; background: none; border: none;
            color: #94a3b8; padding: 12px 16px; margin-bottom: 4px;
            border-radius: 8px; font-size: 0.95rem; cursor: pointer;
            transition: all 0.2s; font-family: inherit; font-weight: 500;
        }
        .nav-btn:hover { background-color: var(--bg-nav); color: white; }
        .nav-btn.active { background-color: var(--primary); color: white; }

        /* Main Content Area */
        #content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .view-container { max-width: 800px; margin: 0 auto; }
        
        h1 { margin-top: 0; font-size: 1.8rem; color: #0f172a; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; }
        
        /* Forms */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }
        
        label { font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 6px; }
        input {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn {
            background: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; font-weight: 500; cursor: pointer; transition: 0.2s; font-family: inherit;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-light); border-color: #cbd5e1; }
        .btn-danger { background: #ef4444; color: white; padding: 6px 12px; font-size: 0.85rem; }

        .custom-field-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        
        /* Obal pro mapu, skrytý pokud nejsme v příslušné záložce */
        #map-container { display: none; width: 100%; height: 100%; }
        #map-container.active { display: block; }
    </style>
</head>
<body>
    <div id="app" style="display: contents;">
        <!-- Sidebar Navigation -->
        <nav id="sidebar">
            <div class="brand">GTFS Builder</div>
            <div class="nav-items">
                <button 
                    v-for="item in store.menuItems" 
                    :key="item"
                    class="nav-btn" 
                    :class="{ active: store.currentView === item }"
                    @click="store.currentView = item">
                    {{ item }}
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="content" v-show="store.currentView !== 'Stops' && store.currentView !== 'Lines'">
            
            <!-- FEED INFO VIEW -->
            <div class="view-container" v-if="store.currentView === 'Feed info'">
                <h1>Feed Information</h1>
                <div class="card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Publisher Name</label>
                            <input v-model="store.feedInfo.feed_publisher_name" placeholder="e.g. Transit Agency">
                        </div>
                        <div class="form-group">
                            <label>Publisher URL</label>
                            <input v-model="store.feedInfo.feed_publisher_url" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Language (ISO 639-1)</label>
                            <input v-model="store.feedInfo.feed_lang" placeholder="en">
                        </div>
                        <div class="form-group">
                            <label>Feed Version</label>
                            <input v-model="store.feedInfo.feed_version" placeholder="1.0.0">
                        </div>
                        <div class="form-group">
                            <label>Start Date (YYYYMMDD)</label>
                            <input v-model="store.feedInfo.feed_start_date" placeholder="20240101">
                        </div>
                        <div class="form-group">
                            <label>End Date (YYYYMMDD)</label>
                            <input v-model="store.feedInfo.feed_end_date" placeholder="20241231">
                        </div>
                        <div class="form-group">
                            <label>Contact Email</label>
                            <input v-model="store.feedInfo.feed_contact_email" placeholder="contact@agency.com">
                        </div>
                        <div class="form-group">
                            <label>Contact URL</label>
                            <input v-model="store.feedInfo.feed_contact_url" placeholder="https://.../contact">
                        </div>
                    </div>
                </div>

                <!-- Custom Fields for Feed Info -->
                <div class="card">
                    <div class="flex-between">
                        <h3 style="margin: 0;">Custom Fields</h3>
                        <button class="btn btn-outline" @click="addCustomField(store.feedInfo.customFields)">+ Add Field</button>
                    </div>
                    <div v-for="(field, index) in store.feedInfo.customFields" :key="index" class="custom-field-row">
                        <input v-model="field.key" placeholder="Key (e.g. feed_id)" style="flex: 1;">
                        <input v-model="field.value" placeholder="Value" style="flex: 2;">
                        <button class="btn btn-danger" @click="store.feedInfo.customFields.splice(index, 1)">✕</button>
                    </div>
                    <p v-if="store.feedInfo.customFields.length === 0" style="color: #94a3b8; font-size: 0.9rem;">No custom fields added.</p>
                </div>
            </div>

            <!-- AGENCIES VIEW -->
            <div class="view-container" v-if="store.currentView === 'Agencies'">
                <div class="flex-between">
                    <h1>Agencies</h1>
                    <button class="btn" @click="addAgency">+ New Agency</button>
                </div>
                
                <div v-for="(agency, aIndex) in store.agencies" :key="agency._internal_id" class="card">
                    <div class="flex-between" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px;">
                        <h3 style="margin: 0; color: #0f172a;">Agency #{{ aIndex + 1 }}</h3>
                        <button class="btn btn-danger" @click="store.agencies.splice(aIndex, 1)">Delete Agency</button>
                    </div>
                    
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Agency ID (optional)</label>
                            <input v-model="agency.agency_id" placeholder="A1">
                        </div>
                        <div class="form-group">
                            <label>Agency Name</label>
                            <input v-model="agency.agency_name" placeholder="City Transit">
                        </div>
                        <div class="form-group">
                            <label>Agency URL</label>
                            <input v-model="agency.agency_url" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Timezone</label>
                            <input v-model="agency.agency_timezone" placeholder="Europe/London">
                        </div>
                    </div>

                    <!-- Custom Fields for this Agency -->
                    <div style="margin-top: 24px; background: var(--bg-light); padding: 16px; border-radius: 8px;">
                        <div class="flex-between" style="margin-bottom: 12px;">
                            <label style="margin: 0;">Custom Fields</label>
                            <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.8rem;" @click="addCustomField(agency.customFields)">+ Add</button>
                        </div>
                        <div v-for="(field, fIndex) in agency.customFields" :key="fIndex" class="custom-field-row">
                            <input v-model="field.key" placeholder="Key (e.g. agency_phone)" style="flex: 1; padding: 6px;">
                            <input v-model="field.value" placeholder="Value" style="flex: 2; padding: 6px;">
                            <button class="btn btn-danger" style="padding: 6px 10px;" @click="agency.customFields.splice(fIndex, 1)">✕</button>
                        </div>
                    </div>
                </div>
                
                <div v-if="store.agencies.length === 0" style="text-align: center; padding: 40px; color: #64748b;">
                    No agencies defined. Add your first transit agency.
                </div>
            </div>

            <!-- Zástupné prázdné views pro ostatní záložky -->
            <div class="view-container" v-if="['Import', 'Calendar', 'Shapes', 'Export'].includes(store.currentView)">
                <h1>{{ store.currentView }}</h1>
                <p style="color: #64748b;">This section is under construction.</p>
            </div>
        </main>
    </div>

    <!-- Modulová aplikace (zůstává ve stejném adresáři) -->
    <script type="module" src="./app.js"></script>
</body>
</html>
